<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fresh Organics — Checkout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="page-payment">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Fresh Organics</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count-header" class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="checkout">
      <h1>Checkout</h1>

      <div id="checkout-items" class="checkout-items">
        <!-- Cart items will be displayed here by script.js -->
      </div>

      <div class="checkout-summary">
        <h3>Delivery Details</h3>
        <form id="checkout-form">
          <label>
            Full Name
            <input type="text" id="customer-name" required />
          </label>
          <label>
            Mobile
            <input type="tel" id="customer-mobile" required />
          </label>
          <label>
            Address
            <textarea id="customer-address" rows="3" required></textarea>
          </label>
          <label>
            Delivery Area
            <select id="delivery-area" required>
              <option value="">Select area</option>
              <option>Hyderabad</option>
              <option>Secunderabad</option>
              <option>Kukatpally</option>
              <option>Miyapur</option>
              <option>Gachibowli</option>
            </select>
          </label>

          <h3>Payment Method</h3>
          <div class="payment-options">
            <label><input type="radio" name="payment" value="Card" checked /> Card</label>
            <label><input type="radio" name="payment" value="UPI" /> UPI</label>
            <label><input type="radio" name="payment" value="COD" /> Cash on Delivery</label>
          </div>

          <div class="order-total">
            <strong>Total:</strong> <span id="checkout-total">₹0</span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Place Order</button>
            <a href="cart.html" class="btn btn-outline">Back to Cart</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Fresh Organics</p>
    </div>
  </footer>

  <a class="whatsapp-fab" href="https://wa.me/919000000000?text=Hi%20Fresh%20Organics%2C%20I%27d%20like%20to%20place%20an%20order." target="_blank" aria-label="Order via WhatsApp">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
  </a>

  <script src="script.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
