<!doctype html>
<html lang="en">
<head>

</head>
<body id="page-cart">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Fresh Organics</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count-header" class="cart-count">0</span></a>

    document.getElementById('year').textContent = new Date().getFullYear();
